<!DOCTYPE html>
<html lang="pt">
<head>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet"> 
 
    <!-- Font Awesome (Via CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../assets/bootstrap/1241035.css" rel="stylesheet"> 
    <!-- Estilos da página-->
    <link rel="stylesheet" href="../assets/css/1241035.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InveMed</title>
    <!--    favicon (icon do site)  -->
    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/png">
</head>

<body>
    <div class="col-lg-5 col-md-6 col-sm-8 col-10">
                <!--borda à volta do formulário-->
            <div class="card p-4">

                <div class="d-flex align-items-center justify-content-center my-4">
                    <img src="../assets/img/logo.png">
                    <h2><strong>InveMed</strong></h2> 
                </div>
                <div class="container">
                    <div class="row"> <!--cria uma linha no layout para as colunas-->
                        <div class="col">
                            <form action="../Public/index.html" method="post">
                                <div class="mb-3">
                                    <!-- Utilizador -->
                                    <label for="email" class="form-label">Utilizador</label>
                                    <input type="email" name="email" id="email" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <!-- Password -->
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" name="password" id="password" class="form-control">
                                </div>
                                <div class="mb-3 text-center">
                                    <!-- Submit -->
                                    <button type="submit" class="btn btn-secondary px-4">
                                        Entrar <i class="fa-solid fa-right-to-bracket ms-2"></i>
                                    </button>
                                </div>
                                <div>
                                    <!-- Erros -->
                                    <div class="alert alert-danger p-2 text-center">
                                        Erro: Utilizador não registado.
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>    
                </div>
            </div>
    </div>                  
    <script src="../assets/bootstrap/1241035.js"></script>
</body>
